frr version 10.7.1
frr defaults traditional
hostname r2
log syslog informational
service integrated-vtysh-config
!
! Chan ro ri: moi dich den trong dai lab ma chua co route cu the se bi drop,
! khong roi ra default route qua eth0 (mgmt). KHONG redistribute route nay.
ipv6 route 2001:db8:100::/56 blackhole
!
interface sr0
 description loopback + SRv6 SID block 2001:db8:100:32::/64
 ipv6 router isis CORE
 isis passive
exit
!
interface eth1
 description to-r1 (link12)
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
!
interface eth2
 description to-r3 (link23)
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
!
interface eth3
 description to-fw2-eth1 (SF3 vao, 49::/64)
exit
!
interface eth4
 description to-fw2-eth2 (SF3 ra, 4a::/64)
exit
!
router isis CORE
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
exit
!
end
