frr version 10.7.1
frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
! Chan ro ri: moi dich den trong dai lab ma chua co route cu the se bi drop,
! khong roi ra default route qua eth0 (mgmt). KHONG redistribute route nay.
ipv6 route 2001:db8:100::/56 blackhole
!
interface sr0
 description loopback + SRv6 SID block 2001:db8:100:31::/64
 ipv6 router isis CORE
 isis passive
exit
!
interface eth1
 description to-h1
 ipv6 router isis CORE
 isis passive
exit
!
interface eth2
 description to-h2
 ipv6 router isis CORE
 isis passive
exit
!
interface eth3
 description to-r2 (link12)
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
!
interface eth4
 description to-r4 (link14)
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 20
exit
!
interface eth5
 description to-r5 (link15)
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 20
exit
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
exit
!
end
